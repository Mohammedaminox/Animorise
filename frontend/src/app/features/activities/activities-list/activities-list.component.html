<div class="container mx-auto p-8">
  <h2 class="text-4xl font-extrabold text-gray-900 mb-8 text-center">
    📋 Mes Activités
  </h2>

  <div class="overflow-x-auto bg-white shadow-md rounded-2xl">
    <table class="w-full border-collapse rounded-lg overflow-hidden">
      <thead class="bg-indigo-500 text-white uppercase text-sm">
      <tr>
        <th class="px-4 py-3 text-left">Description</th>
        <th class="px-4 py-3 text-left">Animal</th>
        <th class="px-4 py-3 text-left">Type</th>
        <th class="px-4 py-3 text-left">Début</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let activity of activities" class="border-b hover:bg-gray-100">
        <td class="px-4 py-3 font-semibold text-indigo-600">
          {{ activity.description }}
        </td>
        <td class="px-4 py-3">{{ activity.animalName }}</td>
        <td class="px-4 py-3">{{ activity.activityTypeName }}</td>
        <td class="px-4 py-3">{{ activity.scheduleStart | date: 'EEEE, dd MMM yyyy - HH:mm' }}</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Floating Action Button -->
<button  (click)="openActivitiesForm()"
        class="fixed bottom-6 right-6 bg-indigo-600 p-5 rounded-full shadow-lg text-white text-2xl transition-transform duration-300 hover:scale-110 hover:shadow-xl focus:outline-none">
  ➕
</button>
