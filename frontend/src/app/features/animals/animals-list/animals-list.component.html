<div class="container mx-auto p-6">
  <h2 class="text-4xl font-extrabold text-gray-900 mb-8 text-center">
    🐾 Meet Our Animals
  </h2>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
    <div *ngFor="let animal of animalsList"
         class="relative bg-white bg-opacity-90 backdrop-blur-lg rounded-xl shadow-lg p-6 transition-all duration-300 hover:shadow-2xl hover:scale-105 flex flex-col items-center text-center border border-gray-200">

      <!-- Image -->
      <div class="relative w-24 h-24 rounded-full border-4 border-indigo-400 shadow-md overflow-hidden">
        <img *ngIf="animal.speciesIcon"
             [src]="'http://localhost:8088/images/' + animal.speciesIcon"
             alt="Species Icon"
             class="w-full h-full object-cover">
      </div>

      <!-- Name -->
      <h3 class="text-xl font-semibold text-gray-900 mt-4">{{ animal.name }}</h3>

      <!-- Species -->
      <p class="text-sm text-gray-500 mt-1">Species ID: {{ animal.speciesName }}</p>

      <!-- Race & Gender -->
      <div class="flex justify-center gap-3 mt-2 text-sm text-gray-600">
        <p>🐕 {{ animal.race }}</p>
        <p>⚥ {{ animal.gender }}</p>
      </div>

      <!-- Vaccination & Health Status -->
      <div class="mt-3 px-4 py-2 bg-gray-100 rounded-lg text-sm text-gray-700">
        <p>💉 Vaccinated: <span class="font-semibold text-indigo-500">{{ animal.vaccinated ? 'Yes' : 'No' }}</span></p>
        <p>❤️ Health: <span class="font-semibold">{{ animal.healthStatus }}</span></p>
      </div>

      <!-- Birth Date -->
      <p class="text-sm text-gray-600 mt-2">🎂 Born: {{ animal.birthDate }}</p>

      <!-- Actions -->
      <div class="flex gap-4 mt-5">
        <button (click)="editAnimal(animal.id!)"
                class="px-5 py-2 bg-gradient-to-r from-blue-500 to-indigo-500 text-white rounded-lg shadow-md hover:shadow-xl hover:scale-105 transition-all">
          ✏️ Edit
        </button>

        <button (click)="deleteAnimal(animal.id!)"
                class="px-5 py-2 bg-gradient-to-r from-red-500 to-pink-500 text-white rounded-lg shadow-md hover:shadow-xl hover:scale-105 transition-all">
          🗑 Delete
        </button>
      </div>

    </div>
  </div>
</div>

<!-- Floating Action Button -->
<button (click)="openAnimalForm()"
        class="fixed bottom-6 right-6 bg-gradient-to-r from-indigo-600 to-purple-600 p-6 rounded-full shadow-lg text-white text-3xl transition-transform duration-300 hover:scale-110 hover:shadow-2xl focus:outline-none">
  ➕
</button>
