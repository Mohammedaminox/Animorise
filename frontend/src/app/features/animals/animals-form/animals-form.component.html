<div class="container mx-auto p-6 bg-white rounded-xl shadow-md max-w-2xl">
  <h2 class="text-xl font-semibold text-gray-900 mb-4 text-center">
    {{ animalId ? 'Edit Animal' : 'Add Animal' }}
  </h2>

  <form [formGroup]="animalForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Name & Race -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
        <input id="name" type="text" formControlName="name"
               class="w-full mt-1 px-4 py-2 border rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
      </div>
      <div>
        <label for="race" class="block text-sm font-medium text-gray-700">Race</label>
        <input id="race" type="text" formControlName="race"
               class="w-full mt-1 px-4 py-2 border rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
      </div>
    </div>

    <!-- Gender & Health Status -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Gender</label>
        <div class="mt-2 flex items-center space-x-6">
          <label class="flex items-center">
            <input type="radio" name="gender" value="Male" formControlName="gender"
                   class="h-4 w-4 text-indigo-600 border-gray-300 focus:ring-indigo-500">
            <span class="ml-2 text-gray-700">Male</span>
          </label>
          <label class="flex items-center">
            <input type="radio" name="gender" value="Female" formControlName="gender"
                   class="h-4 w-4 text-indigo-600 border-gray-300 focus:ring-indigo-500">
            <span class="ml-2 text-gray-700">Female</span>
          </label>
        </div>
      </div>
      <div>
        <label for="healthStatus" class="block text-sm font-medium text-gray-700">Health Status</label>
        <select id="healthStatus" formControlName="healthStatus"
                class="w-full mt-1 px-4 py-2 border rounded-lg shadow-sm bg-white focus:ring-indigo-500 focus:border-indigo-500 cursor-pointer">
          <option value="Healthy">Healthy</option>
          <option value="Sick">Sick</option>
          <option value="UnderTreatment">Under Treatment</option>
        </select>
      </div>
    </div>

    <!-- Vaccinated & Birth Date -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="flex items-center space-x-3">
        <input id="vaccinated" type="checkbox" formControlName="vaccinated"
               class="h-5 w-5 text-indigo-600 border-gray-300 focus:ring-indigo-500">
        <label for="vaccinated" class="text-sm font-medium text-gray-700">Vaccinated</label>
      </div>
      <div>
        <label for="birthDate" class="block text-sm font-medium text-gray-700">Birth Date</label>
        <input id="birthDate" type="date" formControlName="birthDate"
               class="w-full mt-1 px-4 py-2 border rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
      </div>
    </div>

    <!-- Species & Photo Upload -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label for="speciesName" class="block text-sm font-medium text-gray-700">Species</label>
        <select id="speciesName" formControlName="speciesId"
                class="w-full mt-1 px-4 py-2 border rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
          <option *ngFor="let species of speciesList" [value]="species.id">
            {{ species.name }}
          </option>
        </select>
      </div>
    </div>

    <!-- Champ caché pour l'ID de l'utilisateur -->

    <!-- Submit Button -->
    <div class="flex justify-end">
      <button type="submit"
              class="px-5 py-2 bg-indigo-600 text-white rounded-lg shadow-md hover:bg-indigo-700 transition-all">
        {{ animalId ? 'Update' : 'Add' }}
      </button>
    </div>
  </form>
</div>
