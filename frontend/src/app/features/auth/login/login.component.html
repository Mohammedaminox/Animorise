<section class="relative flex justify-center items-center min-h-screen px-6 py-12">
  <!-- Background Gradient -->
  <div class="absolute inset-0 bg-gradient-to-br from-teal-500 via-purple-500 to-pink-400"></div>

  <!-- Floating Paw Prints -->
  <div class="absolute inset-0 pointer-events-none">
    <div class="paw absolute top-20 left-14 opacity-10 animate-bounce">
      🐾
    </div>
    <div class="paw absolute bottom-24 right-16 opacity-10 animate-spin">
      🐾
    </div>
  </div>

  <!-- Login Card -->
  <div class="relative z-10 w-full max-w-lg bg-white/20 backdrop-blur-xl rounded-2xl shadow-lg p-8 border border-white/30">
    <h2 class="text-3xl font-extrabold text-white text-center">Welcome Back! 🐶</h2>
    <p class="text-white/80 text-center mt-2">Log in to manage your pet’s health and activities.</p>

    <form [formGroup]="loginForm" (ngSubmit)="login()" class="mt-6 space-y-4">
      <div>
        <label class="block text-white">Email</label>
        <input type="email" formControlName="email" placeholder="Enter your email"
               class="w-full px-4 py-3 rounded-lg bg-white/80 focus:ring-2 focus:ring-teal-300">
        <p *ngIf="loginForm.controls['email'].invalid && loginForm.controls['email'].touched" class="text-red-500 text-sm">
          Valid email is required.
        </p>
      </div>

      <div>
        <label class="block text-white">Password</label>
        <input type="password" formControlName="password" placeholder="Enter your password"
               class="w-full px-4 py-3 rounded-lg bg-white/80 focus:ring-2 focus:ring-teal-300">
        <p *ngIf="loginForm.controls['password'].invalid && loginForm.controls['password'].touched" class="text-red-500 text-sm">
          Password must be at least 6 characters long.
        </p>
      </div>

      <div class="flex justify-between items-center mt-2">
        <label class="text-white flex items-center">
          <input type="checkbox" class="mr-2"> Remember Me
        </label>
        <a href="#" class="text-teal-300 hover:text-white transition">Forgot Password?</a>
      </div>

      <p *ngIf="errorMessage" class="text-red-500 text-sm">{{ errorMessage }}</p>

      <button type="submit" [disabled]="isLoading || loginForm.invalid"
              class="w-full mt-4 bg-yellow-400 hover:bg-yellow-500 text-white font-bold py-3 rounded-lg shadow-lg transition duration-300">
        {{ isLoading ? 'Logging in...' : '🐾 Log In' }}
      </button>
    </form>


    <p class="text-center text-white/80 mt-4">New to PetCare?
      <a routerLink="/auth/register" routerLinkActive="active" class="text-teal-300 hover:text-white transition">Sign Up</a>
    </p>
  </div>
</section>
