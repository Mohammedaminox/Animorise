<header class="bg-white/80 backdrop-blur-md shadow-lg flex items-center justify-between p-4 rounded-xl mx-4 mt-4">
  <div class="text-2xl font-bold text-indigo-600 flex items-center space-x-2">
    <span>🐾</span>
    <span>PetCare Dashboard</span>
  </div>

  <div class="flex items-center space-x-6">
    <!-- Search Bar -->
    <div class="relative">
      <input type="text" placeholder="Search..."
             class="p-2 pl-10 w-40 transition-all duration-300 border border-gray-300 rounded-full focus:w-64 focus:border-indigo-500 focus:outline-none">
      <span class="absolute left-3 top-2 text-gray-400">🔍</span>
    </div>

    <!-- Notification Bell -->
    <div class="relative cursor-pointer">
      <span class="text-2xl transition-all duration-300 hover:scale-110">🔔</span>
      <span class="absolute -top-1 -right-1 bg-red-500 text-white text-xs px-1.5 py-0.5 rounded-full animate-bounce">3</span>
    </div>

    <!-- User Profile -->
    <div class="relative group">
      <div class="flex items-center cursor-pointer space-x-2">
        <span class="text-2xl">👤</span>
        <span class="text-gray-700 font-medium">John Doe</span>
      </div>

      <!-- Dropdown Menu -->
      <div class="absolute right-0 mt-2 w-40 bg-white shadow-lg rounded-lg p-2 opacity-0 invisible transition-all duration-300 group-hover:opacity-100 group-hover:visible">
        <a href="#" class="block px-4 py-2 hover:bg-gray-100 rounded">Profile</a>
        <a href="#" class="block px-4 py-2 hover:bg-gray-100 rounded">Settings</a>
        <a href="#" class="block px-4 py-2 text-red-500 hover:bg-gray-100 rounded">Logout</a>
      </div>
    </div>
  </div>
</header>
