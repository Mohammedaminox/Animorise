<aside class="w-72 bg-white/90 backdrop-blur-lg shadow-xl rounded-r-3xl text-gray-900 flex flex-col transform transition-all duration-300 ease-in-out">

    <span class="text-4xl">🐾</span>
    <span class="text-indigo-600">PetCare</span>
  </div>

  <!-- Navigation -->
  <nav class="flex flex-col space-y-4 p-6 mt-4">
    <a routerLink="/dashboard/home" class="flex items-center space-x-3 p-3 rounded-lg text-lg font-medium transition-all duration-300 ease-in-out hover:bg-indigo-500 hover:text-white hover:shadow-lg">
      <span>🏠</span> <span>Dashboard</span>
    </a>

    <a routerLink="/pets" class="flex items-center space-x-3 p-3 rounded-lg text-lg font-medium transition-all duration-300 ease-in-out hover:bg-indigo-500 hover:text-white hover:shadow-lg">
      <span>🐶</span> <span>My Pets</span>
    </a>

    <a routerLink="/dashboard/species" class="flex items-center space-x-3 p-3 rounded-lg text-lg font-medium transition-all duration-300 ease-in-out hover:bg-indigo-500 hover:text-white hover:shadow-lg">
      <span>🦴</span> <span>My Species</span>
    </a>

    <a routerLink="/dashboard/activityType" class="flex items-center space-x-3 p-3 rounded-lg text-lg font-medium transition-all duration-300 ease-in-out hover:bg-indigo-500 hover:text-white hover:shadow-lg">
      <span>🦴</span> <span>My ActivityTypes</span>
    </a>

    <a routerLink="/dashboard/animals" class="flex items-center space-x-3 p-3 rounded-lg text-lg font-medium transition-all duration-300 ease-in-out hover:bg-indigo-500 hover:text-white hover:shadow-lg">
      <span>📅</span> <span>Animals</span>
    </a>

    <a routerLink="/settings" class="flex items-center space-x-3 p-3 rounded-lg text-lg font-medium transition-all duration-300 ease-in-out hover:bg-indigo-500 hover:text-white hover:shadow-lg">
      <span>⚙️</span> <span>Settings</span>

  <!-- Logout Button -->

  <span class="text-2xl opacity-90 transition-all duration-300 ease-in-out group-hover:rotate-[-8deg]">
    🔑
  </span>
    <span class="tracking-wide">Sign Out</span>
  </button>



  <!-- Footer -->
  <div class="absolute bottom-0 left-0 right-0 p-4 text-center text-sm font-medium text-gray-500">
    Your Trusted Pet Companion 🐕‍🦺
  </div>
</aside>
